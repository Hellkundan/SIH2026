services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dixy
      POSTGRES_USER: dixy
      POSTGRES_PASSWORD: dixy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dixy -d dixy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_JWT_SECRET: "ZGl4eS1zaWgtMjAyNi1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2"
      APP_JWT_EXPIRATION_MS: "3600000"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/dixy"
      SPRING_DATASOURCE_USERNAME: "dixy"
      SPRING_DATASOURCE_PASSWORD: "dixy_password"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      OCR_SERVICE_URL: "http://ocr:8001"
      VERIFICATION_HUB_URL: "http://verification-hub:8000"
      AI_SERVICE_URL: "http://ai-service:8002"
      DOCUMENTS_DIR: "/app/data/documents"
    depends_on:
      postgres:
        condition: service_healthy
      verification-hub:
        condition: service_healthy
      ocr:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  verification-hub:
    build:
      context: ./src/verification_hub
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr:
    build:
      context: ./src/ocr
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./src/AI
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
