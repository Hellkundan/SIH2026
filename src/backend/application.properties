spring.application.name=dixy-backend

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dixy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dixy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dixy_password}
spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret=${APP_JWT_SECRET:ZGl4eS1zaWgtMjAyNi1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.ocr.base-url=${OCR_SERVICE_URL:http://localhost:8001}
app.verification.base-url=${VERIFICATION_HUB_URL:http://localhost:8000}
app.storage.documents-dir=${DOCUMENTS_DIR:./data/documents}