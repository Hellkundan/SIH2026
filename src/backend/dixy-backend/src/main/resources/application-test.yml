# ═══════════════════════════════════════════════════════════════════════════════
# DIXY Backend — Test-specific configuration
# This overrides application.yml ONLY when running `mvn test`
# Uses H2 in-memory database so tests never touch your real PostgreSQL
# ═══════════════════════════════════════════════════════════════════════════════

spring:

  datasource:
    url: jdbc:h2:mem:dixy_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop


  h2:
    console:
      enabled: false  # Don't expose H2 console even in tests

jwt:
  secret: test-secret-key-for-unit-tests-only-not-used-in-production
  expiration-ms: 3600000   # 1 hour — enough for a test run

logging:
  level:
    com.dixy: WARN    # Keep test output clean
    org.springframework.security: WARN
