# ═══════════════════════════════════════════════════════════════════════════════
# DIXY Backend — Application Configuration
# ─────────────────────────────────────────
# SECURITY RULE: This file is safe to commit to Git.
# Secrets (DB password, JWT secret) are injected via ENVIRONMENT VARIABLES only.
# Never put real passwords here — use ${ENV_VAR_NAME:default-for-dev} syntax.
# ═══════════════════════════════════════════════════════════════════════════════

spring:

  application:
    name: dixy-backend

  # ─── Database (PostgreSQL) ───────────────────────────────────────────────────
  datasource:
    # ${VAR:default} means: use environment variable VAR, or fall back to default
    # In dev you can use the default. In production, ALWAYS set the env var.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dixy_db}
    username: ${DB_USERNAME:dixy_user}
    password: ${DB_PASSWORD:dixy_dev_password}   # ← OVERRIDE this in .env for any real environment
    driver-class-name: org.postgresql.Driver

    # Connection pool settings — HikariCP (Spring Boot default)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000   # 30 seconds
      idle-timeout: 600000        # 10 minutes

  # ─── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  # ─── JSON serialization ───────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false  # Use ISO 8601 strings, not epoch numbers
    default-property-inclusion: non_null  # Don't serialize null fields

# ─── Server ──────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    # Don't expose stack traces in error responses (security best practice)
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# ─── JWT Configuration ───────────────────────────────────────────────────────
# CRITICAL: jwt.secret MUST be overridden with a strong secret in production.
# Minimum 256 bits (32 chars). Use a random generator.
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ─── CORS Configuration ──────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.dixy: ${LOG_LEVEL:DEBUG}           # Our code — verbose in dev
    org.springframework.security: INFO     # Spring Security events
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:WARN}  # Set to DEBUG to see raw SQL
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ─── Swagger / OpenAPI ───────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  # Show the Authorize button in Swagger UI for JWT testing
  show-actuator: false

# ─── File Upload (for document security — Phase 7) ──────────────────────────
spring.servlet.multipart:
  max-file-size: ${MAX_FILE_SIZE:10MB}
  max-request-size: ${MAX_REQUEST_SIZE:10MB}

